# Isolated sandbox: backend starts throw-away test containers through the host Docker.
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up --build
# WARNING: mounting docker.sock gives the backend root-level power over the host.
# Run this only on a dedicated machine. The shared dir must have the SAME path inside and outside.
services:
  backend:
    build:
      context: ./backend
      args: { INSTALL_DOCKER_CLI: "true" }
    user: root
    environment:
      SANDBOX_MODE: docker
      SANDBOX_WORKDIR: /srv/selfheal-work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/selfheal-work:/srv/selfheal-work
